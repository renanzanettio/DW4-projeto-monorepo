name: Monorepo CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validacoes-e-testes:
    name: 1. Qualidade, Tipos e Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4

      - name: 3. Configurar o Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 4. Instalar Dependências do Monorepo
        run: pnpm install --frozen-lockfile

      - name: 5. Validar Padronização de Código (ESLint)
        run: pnpm --filter backend run lint

      - name: 6. Validar Formatação de Arquivos (Prettier)
        run: pnpm --filter backend run format:check

      - name: 7. Checagem de Tipos no Backend
        run: pnpm --filter backend run type-check

      - name: 8. Executar Testes com Cobertura
        run: pnpm --filter backend run test:coverage
        env:
          NODE_ENV: test

      - name: 9. Validar Frontend
        run: |
          pnpm --filter app run lint
          pnpm --filter app run build

      - name: 10. Verificar Configuração do SonarQube
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "habilitado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube não configurado. A análise externa não será executada."
            echo "### SonarQube: não executado (SONAR_TOKEN ausente)" >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
              echo "::error::Configure SONAR_HOST_URL nos secrets e SONAR_PROJECT_KEY e SONAR_ORGANIZATION nas variables do repositório."
              exit 1
            fi
            echo "habilitado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 11. Executar Análise Estática com SonarQube
        if: steps.sonar.outputs.habilitado == 'true'
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: backend
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: 12. Validar SonarQube Quality Gate
        if: steps.sonar.outputs.habilitado == 'true'
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: backend/.scannerwork/report-task.txt
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: 13. Salvar Artefatos de Cobertura (HTML e LCOV)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-backend
          path: backend/coverage
          retention-days: 14
          if-no-files-found: warn

  validar-build-docker:
    name: 2. Validação de Build do Docker
    needs: [validacoes-e-testes]
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fatec_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fatec_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Testar se o Dockerfile Compila sem Erros
        run: docker build -t api-service:smoke-test ./backend

      - name: 3. Validar Inicialização da Imagem de Produção
        run: |
          docker run -d --name api-smoke-test --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_NAME=fatec_db \
            -e DB_USER=postgres -e DB_PASSWORD=postgres -e DB_SSL=false \
            -e JWT_SECRET=chave-apenas-para-teste-do-ci \
            api-service:smoke-test
          for tentativa in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo "### Build Docker e health check aprovados" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          docker logs api-smoke-test
          exit 1

      - name: 4. Encerrar Contêiner de Teste
        if: always()
        run: docker rm -f api-smoke-test || true
