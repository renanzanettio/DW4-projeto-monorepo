name: Monorepo CI Pipeline

on:
    # Dispara automaticamente ao enviar novos commits para a branch main
    push:
        branches:
            - main
    # Dispara na abertura ou atualização de pull requests para a branch main
    pull_request:
        branches:
            - main
    # Permite execução manual pelo painel web do Github ( Aba Action -> Run workflow )
    workflow_dispatch:
    
jobs:
    validar-monorepo:
        name: Validar Backend, Frontend e Docker
        runs-on: ubuntu-latest

        steps:
            - name: 1. Baixar o código fonte
              uses: actions/checkout@v4

            - name: 2. Habilitar o pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: 3. Configurar o Node.js 24 com Cache de Dependencias
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: 4. Instalar dependências do Backend
              run: |
                cd backend
                pnpm install --frozen-lockfile

            - name: 5. Validar Tipos e Compilar o Backend (Express)
              run: |
                cd backend
                pnpm run build

            